<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* DXC Brand 2025 RGB palette — context/brand.md */
    --bg: #F6F3F0;       /* Canvas */
    --panel: #FFFFFF;    /* White */
    --panel2: #ECE7E0;   /* Canvas-tinted control bg */
    --border: #DAD3C9;
    --text: #0E1020;     /* Midnight Blue */
    --text-dim: #6B7280;
    --amber: #FFAE41;    /* Gold — callouts / emphasis (fills) */
    --amber-text: #A66A00; /* darkened Gold — legible as text/border on light bg */
    --amber-dim: #FFF1D9;
    --green: #2E8B57;
    --red: #D14600;      /* Red — brand accent, used here for danger/error */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-width: 320px;
  }
  header {
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
  #counter { font-size: 15px; color: var(--text-dim); }
  #counter b { color: var(--amber-text); }
  .layout { max-width: 1200px; margin: 0 auto; padding: 16px; }
  aside#voices-aside {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
  }
  aside#voices-aside h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); }
  .voice-test-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .voice-test-row:last-child { border-bottom: none; }
  .voice-test-row .voice-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  section h2 {
    margin: 0 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
  }
  .q-header {
    margin: 12px 0 8px;
    padding: 8px 0 6px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--amber-text);
    font-weight: 600;
  }
  .q-header:first-child { margin-top: 0; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type="text"], input[type="password"], select, textarea {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { width: 100%; min-height: 80px; resize: vertical; }
  input[type="password"] { flex: 1; min-width: 200px; }
  button {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--amber-text); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--amber); color: #241a08; border-color: var(--amber); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--red); border-color: var(--red); }
  button.danger:hover { background: var(--red); color: #fff; }
  button.icon { padding: 6px 10px; font-size: 13px; }
  #questions-list .q-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  #questions-list .q-row:last-child { border-bottom: none; }
  #questions-list .q-row.asked { opacity: 0.45; }
  .q-order { display: flex; flex-direction: column; gap: 2px; }
  .q-order button { padding: 2px 6px; font-size: 11px; line-height: 1; }
  .q-text { flex: 1 1 50%; min-width: 160px; cursor: text; padding: 4px 6px; border-radius: 4px; }
  .q-text:hover { background: var(--panel2); }
  .q-text input { width: 100%; }
  .q-text-input { flex: 1 1 50%; min-width: 160px; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 14px; font-family: inherit; resize: vertical; line-height: 1.4; }
  .q-controls { flex: 1 1 220px; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .q-controls-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .q-voice select { width: 100%; }
  .status-badge {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .status-none { color: var(--text-dim); border-color: var(--border); }
  .status-generating { color: var(--amber-text); border-color: var(--amber-text); }
  .status-ready { color: var(--green); border-color: var(--green); }
  .status-error { color: var(--red); border-color: var(--red); }
  #empty-msg { color: var(--text-dim); text-align: center; padding: 20px; }
  #import-file { display: none; }
</style>
</head>
<body>

<header>
  <h1>Q Desk</h1>
  <div id="counter"></div>
</header>

<div class="layout">
<main>

  <section id="settings-section">
    <h2>ElevenLabs Settings</h2>
    <div class="row-flex">
      <input type="password" id="api-key-input" placeholder="ElevenLabs API Key">
      <button id="load-voices-btn">Load Voices</button>
      <select id="default-voice-select"><option value="">Default Voice: —</option></select>
    </div>
    <div class="hint">Key saved only in this browser (localStorage) and sent directly to api.elevenlabs.io — never to any other server.</div>
  </section>

  <section id="bulk-actions">
    <h2>Bulk Actions</h2>
    <div class="row-flex">
      <button class="primary" id="generate-all-btn">Generate All Missing</button>
      <button id="reset-all-btn">Reset All to Unasked</button>
      <button id="randomize-voices-btn">Randomize Voices</button>
    </div>
  </section>

  <section id="questions-section">
    <h2>Questions List</h2>
    <div id="questions-list"></div>
    <div id="empty-msg" style="display:none;">No questions. Paste a list above.</div>
  </section>

  <section id="add-section">
    <h2>Add Questions</h2>
    <textarea id="bulk-textarea" placeholder="Paste questions, one line = one question"></textarea>
    <div class="row-flex" style="margin-top:8px;">
      <button class="primary" id="add-btn">Add to List</button>
      <button id="export-btn">Export JSON</button>
      <button id="import-btn">Import JSON</button>
      <input type="file" id="import-file" accept="application/json">
    </div>
  </section>

  <aside id="voices-aside">
    <h2>Voice Testing</h2>
    <div id="voices-test-list"></div>
  </aside>

</main>
</div>

<script>
(function () {
  "use strict";

  // ---------- storage ----------
  const LS_KEYS = {
    apiKey: "qdesk_apikey",
    defaultVoice: "qdesk_default_voice",
    voices: "qdesk_voices",
    questions: "qdesk_questions",
    questionsSource: "qdesk_questions_source",
  };

  const state = {
    apiKey: localStorage.getItem(LS_KEYS.apiKey) || "",
    defaultVoiceId: localStorage.getItem(LS_KEYS.defaultVoice) || "",
    voices: JSON.parse(localStorage.getItem(LS_KEYS.voices) || "[]"),
    questions: JSON.parse(localStorage.getItem(LS_KEYS.questions) || "[]"),
    editingId: null,
    playingId: null,
  };

  function saveQuestions() { localStorage.setItem(LS_KEYS.questions, JSON.stringify(state.questions)); }
  function saveApiKey() { localStorage.setItem(LS_KEYS.apiKey, state.apiKey); }
  function saveDefaultVoice() { localStorage.setItem(LS_KEYS.defaultVoice, state.defaultVoiceId); }
  function saveVoices() { localStorage.setItem(LS_KEYS.voices, JSON.stringify(state.voices)); }

  // ---------- IndexedDB (audio blobs) ----------
  const DB_NAME = "qdesk";
  const STORE = "audio";
  const dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  async function saveAudio(id, blob) {
    const db = await dbPromise;
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(blob, id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  async function loadAudio(id) {
    const db = await dbPromise;
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function deleteAudio(id) {
    const db = await dbPromise;
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  const player = new Audio();
  player.addEventListener("play", render);
  player.addEventListener("pause", render);
  player.addEventListener("ended", () => { state.playingId = null; render(); });

  // ---------- DOM refs ----------
  const apiKeyInput = document.getElementById("api-key-input");
  const loadVoicesBtn = document.getElementById("load-voices-btn");
  const defaultVoiceSelect = document.getElementById("default-voice-select");
  const bulkTextarea = document.getElementById("bulk-textarea");
  const addBtn = document.getElementById("add-btn");
  const exportBtn = document.getElementById("export-btn");
  const importBtn = document.getElementById("import-btn");
  const importFile = document.getElementById("import-file");
  const generateAllBtn = document.getElementById("generate-all-btn");
  const resetAllBtn = document.getElementById("reset-all-btn");
  const randomizeVoicesBtn = document.getElementById("randomize-voices-btn");
  const questionsList = document.getElementById("questions-list");
  const emptyMsg = document.getElementById("empty-msg");
  const counterEl = document.getElementById("counter");
  const voicesAside = document.getElementById("voices-aside");
  const voicesTestList = document.getElementById("voices-test-list");

  apiKeyInput.value = state.apiKey;

  // ---------- rendering ----------
  function voiceOptionsHtml(selectedId) {
    return state.voices.map(v =>
      `<option value="${v.voice_id}" ${v.voice_id === selectedId ? "selected" : ""}>${escapeHtml(v.name)}</option>`
    ).join("");
  }

  function renderDefaultVoiceSelect() {
    defaultVoiceSelect.innerHTML =
      `<option value="">Default Voice: —</option>` + voiceOptionsHtml(state.defaultVoiceId);
  }

  function renderVoicesAside() {
    voicesAside.style.display = state.voices.length ? "block" : "none";
    voicesTestList.innerHTML = state.voices.map(v => `
      <div class="voice-test-row">
        <span class="voice-name" title="${escapeHtml(v.name)}">${escapeHtml(v.name)}</span>
        <button class="icon" data-action="test-voice" data-id="${v.voice_id}" ${v.preview_url ? "" : "disabled"}>▶</button>
      </div>`).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function statusLabel(q) {
    switch (q.status) {
      case "generating": return { text: "generating...", cls: "status-generating" };
      case "ready": return { text: "ready", cls: "status-ready" };
      case "error": return { text: "generation error", cls: "status-error" };
      default: return { text: "not generated", cls: "status-none" };
    }
  }

  function render() {
    counterEl.innerHTML = `<b>${state.questions.filter(q => q.asked).length}</b> / ${state.questions.length} asked`;
    emptyMsg.style.display = state.questions.length ? "none" : "block";

    const html = state.questions.map((q, i) => {
      const st = statusLabel(q);
      const isEditing = state.editingId === q.id;
      const textHtml = isEditing
        ? `<textarea class="q-text-input" data-id="${q.id}" rows="3">${escapeHtml(q.text)}</textarea>`
        : `<span class="q-text" data-id="${q.id}">${escapeHtml(q.text)}</span>`;
      const genBtnLabel = q.status === "generating" ? "Generating..." : (q.status === "ready" || q.status === "error" ? "Regenerate" : "Generate");

      const headerHtml = q.header ? `<div class="q-header">${escapeHtml(q.header)}</div>` : "";

      return headerHtml + `
        <div class="q-row ${q.asked ? "asked" : ""}" data-id="${q.id}">
          <div class="q-order">
            <button class="icon" data-action="up" data-id="${q.id}" ${i === 0 ? "disabled" : ""}>▲</button>
            <button class="icon" data-action="down" data-id="${q.id}" ${i === state.questions.length - 1 ? "disabled" : ""}>▼</button>
          </div>
          ${textHtml}
          <div class="q-controls">
            <div class="q-controls-row q-voice">
              <select data-action="voice" data-id="${q.id}">
                <option value="">Default</option>
                ${voiceOptionsHtml(q.voiceId)}
              </select>
            </div>
            <div class="q-controls-row">
              <span class="status-badge ${st.cls}">${st.text}</span>
              <button data-action="bump" data-id="${q.id}" ${i === 0 ? "disabled" : ""}>⤒ Bump</button>
              <button data-action="generate" data-id="${q.id}" ${q.status === "generating" ? "disabled" : ""}>${genBtnLabel}</button>
              <button data-action="ask" data-id="${q.id}" ${q.status !== "ready" ? "disabled" : ""}>${state.playingId === q.id && !player.paused ? "⏸ Pause" : (state.playingId === q.id ? "▶ Resume" : "▶ Ask")}</button>
              ${q.asked ? `<button data-action="restore" data-id="${q.id}">Restore</button>` : ""}
              <button class="danger" data-action="delete" data-id="${q.id}">Delete</button>
            </div>
          </div>
        </div>`;
    }).join("");
    questionsList.innerHTML = html;
  }

  // ---------- settings actions ----------
  apiKeyInput.addEventListener("change", () => {
    state.apiKey = apiKeyInput.value.trim();
    saveApiKey();
  });

  loadVoicesBtn.addEventListener("click", async () => {
    if (!state.apiKey) { alert("Please enter the API key first."); return; }
    loadVoicesBtn.disabled = true;
    loadVoicesBtn.textContent = "Loading...";
    try {
      const res = await fetch("https://api.elevenlabs.io/v1/voices", {
        headers: { "xi-api-key": state.apiKey },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      state.voices = (data.voices || []).map(v => ({ voice_id: v.voice_id, name: v.name, preview_url: v.preview_url || "" }));
      saveVoices();
      renderDefaultVoiceSelect();
      renderVoicesAside();
      render();
    } catch (e) {
      alert("Failed to load voices: " + e.message);
    } finally {
      loadVoicesBtn.disabled = false;
      loadVoicesBtn.textContent = "Load Voices";
    }
  });

  defaultVoiceSelect.addEventListener("change", () => {
    state.defaultVoiceId = defaultVoiceSelect.value;
    saveDefaultVoice();
  });

  // ---------- add / export / import ----------
  addBtn.addEventListener("click", () => {
    const lines = bulkTextarea.value.split("\n").map(l => l.trim()).filter(Boolean);
    for (const text of lines) {
      state.questions.push({ id: crypto.randomUUID(), text, voiceId: "", header: "", status: "none", asked: false });
    }
    bulkTextarea.value = "";
    saveQuestions();
    render();
  });

  exportBtn.addEventListener("click", () => {
    const data = state.questions.map(q => ({ text: q.text, voiceId: q.voiceId, ...(q.header && { header: q.header }) }));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "qdesk-questions.json";
    a.click();
  });

  importBtn.addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", async () => {
    const file = importFile.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      for (const item of data) {
        state.questions.push({
          id: crypto.randomUUID(),
          text: String(item.text || ""),
          voiceId: item.voiceId || "",
          header: item.header || "",
          status: "none",
          asked: false,
        });
      }
      saveQuestions();
      render();
    } catch (e) {
      alert("Invalid JSON file: " + e.message);
    } finally {
      importFile.value = "";
    }
  });

  // ---------- generation ----------
  async function generateAudio(q) {
    q.status = "generating";
    saveQuestions();
    render();
    try {
      const voiceId = q.voiceId || state.defaultVoiceId;
      if (!voiceId) throw new Error("no voice selected");
      if (!state.apiKey) throw new Error("no API key");
      const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
        method: "POST",
        headers: {
          "xi-api-key": state.apiKey,
          "Content-Type": "application/json",
          "Accept": "audio/mpeg",
        },
        body: JSON.stringify({ text: q.text, model_id: "eleven_multilingual_v2" }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const blob = await res.blob();
      await saveAudio(q.id, blob);
      q.status = "ready";
    } catch (e) {
      q.status = "error";
      console.error("Audio generation failed:", e);
    }
    saveQuestions();
    render();
  }

  generateAllBtn.addEventListener("click", async () => {
    // ponytail: sequential, not parallel — avoids hammering the ElevenLabs rate limit before a live event
    for (const q of state.questions) {
      if (q.status !== "ready") await generateAudio(q);
    }
  });

  resetAllBtn.addEventListener("click", () => {
    for (const q of state.questions) q.asked = false;
    saveQuestions();
    render();
  });

  randomizeVoicesBtn.addEventListener("click", () => {
    if (!state.voices.length) { alert("Load voices first."); return; }
    state.questions.forEach((q, i) => { q.voiceId = state.voices[i % state.voices.length].voice_id; });
    saveQuestions();
    render();
  });

  voicesTestList.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action='test-voice']");
    if (!btn) return;
    const v = state.voices.find(v => v.voice_id === btn.dataset.id);
    if (!v || !v.preview_url) return;
    player.pause();
    player.src = v.preview_url;
    player.play();
  });

  // ---------- row actions (event delegation) ----------
  questionsList.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (btn) {
      const id = btn.dataset.id;
      const q = state.questions.find(q => q.id === id);
      if (!q) return;
      const idx = state.questions.indexOf(q);
      switch (btn.dataset.action) {
        case "up":
          if (idx > 0) [state.questions[idx - 1], state.questions[idx]] = [state.questions[idx], state.questions[idx - 1]];
          saveQuestions(); render();
          break;
        case "down":
          if (idx < state.questions.length - 1) [state.questions[idx + 1], state.questions[idx]] = [state.questions[idx], state.questions[idx + 1]];
          saveQuestions(); render();
          break;
        case "bump":
          if (idx > 0) { state.questions.splice(idx, 1); state.questions.unshift(q); }
          saveQuestions(); render();
          break;
        case "delete":
          if (confirm("Delete this question?")) {
            state.questions.splice(idx, 1);
            await deleteAudio(id);
            saveQuestions(); render();
          }
          break;
        case "generate":
          generateAudio(q);
          break;
        case "ask": {
          if (q.status !== "ready") return;
          if (state.playingId === q.id) {
            if (player.paused) player.play(); else player.pause();
            render();
            break;
          }
          q.asked = true;
          saveQuestions();
          const blob = await loadAudio(q.id);
          if (blob) {
            player.pause();
            player.src = URL.createObjectURL(blob);
            state.playingId = q.id;
            player.play();
          }
          render();
          break;
        }
        case "restore":
          q.asked = false;
          saveQuestions(); render();
          break;
      }
      return;
    }

    const textEl = e.target.closest(".q-text");
    if (textEl) {
      state.editingId = textEl.dataset.id;
      render();
      const input = questionsList.querySelector(".q-text-input");
      if (input) { input.focus(); input.select(); }
    }
  });

  questionsList.addEventListener("change", (e) => {
    const sel = e.target.closest("select[data-action='voice']");
    if (sel) {
      const q = state.questions.find(q => q.id === sel.dataset.id);
      if (q) { q.voiceId = sel.value; saveQuestions(); }
    }
  });

  function commitEdit(input) {
    const q = state.questions.find(q => q.id === input.dataset.id);
    if (q) q.text = input.value.trim() || q.text;
    state.editingId = null;
    saveQuestions();
    render();
  }
  questionsList.addEventListener("blur", (e) => {
    if (e.target.classList.contains("q-text-input")) commitEdit(e.target);
  }, true);
  questionsList.addEventListener("keydown", (e) => {
    if (e.target.classList.contains("q-text-input") && e.key === "Enter") commitEdit(e.target);
  });

  // ---------- init ----------
  async function autoLoadQuestions() {
    try {
      const res = await fetch(`questions.json?v=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) return;
      const data = await res.json();
      const source = JSON.stringify(data);
      if (state.questions.length && localStorage.getItem(LS_KEYS.questionsSource) === source) return;

      state.questions = data.map(item => ({
        id: crypto.randomUUID(),
        text: String(item.text || ""),
        voiceId: item.voiceId || "",
        header: item.header || "",
        status: "none",
        asked: false,
      }));
      localStorage.setItem(LS_KEYS.questionsSource, source);
      saveQuestions();
      render();
    } catch (e) {
      console.warn("Failed to auto-load questions.json:", e);
    }
  }

  renderDefaultVoiceSelect();
  renderVoicesAside();
  render();
  autoLoadQuestions();
})();
</script>
</body>
</html>
